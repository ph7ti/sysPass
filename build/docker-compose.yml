services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: syspass
    volumes:
      - syspass-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: build/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_SERVER: db
    volumes:
      - syspass-config:/var/www/syspass/app/config
    depends_on:
      db:
        condition: service_healthy

volumes:
  syspass-db:
  syspass-config:
